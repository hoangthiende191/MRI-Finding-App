<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MRI Radiology Database</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
    <div class="container nav">
        <a class="brand" href="{{ url_for('index') }}">MRI Radiology DB</a>
        <nav>
            <a href="{{ url_for('application_1') }}">Application 1</a>
            <a href="{{ url_for('application_2') }}">Application 2</a>
            <a href="{{ url_for('application_3') }}">Application 3</a>
        </nav>
    </div>
</header>

<main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</main>
</body>
</html>
